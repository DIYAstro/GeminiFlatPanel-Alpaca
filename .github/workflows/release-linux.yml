name: Build & Publish Linux Release Assets

# Manual only, matching release-windows.yml. Builds geminiflatpanel-linux-amd64/-arm64
# natively (no cross-compile toolchain needed - see build_linux.sh, which this reuses
# as-is) and attaches them, plus install_linux.sh, to an ALREADY-EXISTING release - this
# workflow never creates one itself.
#
# No libusb/gcc install step is needed here - this project has no cgo dependency on
# Linux at all (see build_linux.sh's own header comment for why).
#
# Each matrix leg (amd64/arm64) builds and uploads its own binary directly - no separate
# publish job or upload-artifact/download-artifact hand-off, same as release-windows.yml.
# install_linux.sh is arch-independent, so only the amd64 leg uploads it, to avoid two
# parallel jobs racing `gh release upload --clobber` against the same asset name.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to attach Linux assets to (blank = current 'latest' release)"
        required: false
        type: string
  workflow_call:
    inputs:
      release_tag:
        description: "Release tag to attach Linux assets to (blank = current 'latest' release)"
        required: false
        type: string

permissions:
  contents: write # needed for `gh release upload`

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      # ref explicit - same reasoning as release-windows.yml: without it, a reusable-
      # workflow call with a release_tag pointing elsewhere would silently build the
      # wrong source.
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_tag }}

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"

      # Reads release_version.json, patches versioninfo.json, builds the frontend, and
      # compiles build/geminiflatpanel-linux-<arch> - see build_scripts/readme.md.
      - name: Build
        run: bash build_scripts/build_linux.sh

      # Each matrix leg resolves the tag itself (this step is cheap and per-arch, no need for a
      # separate job just to share one `gh release view` call).
      - name: Resolve target release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.release_tag }}"
          if [ -z "$TAG" ]; then
            TAG=$(gh release view --json tagName -q .tagName)
          fi
          echo "Target release: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # Guards against a Windows working-tree copy with CRLF line endings ending up on a
      # release, where it would crash immediately when piped into bash on the target
      # Linux system. .gitattributes (*.sh text eol=lf) should already prevent this in
      # the working tree this checkout produces - this is a cheap, explicit
      # belt-and-suspenders check right before it goes out the door. Only the amd64 leg
      # uploads install_linux.sh (see below), so only it needs to check it.
      - name: Sanity-check install_linux.sh has no CRLF line endings
        if: matrix.arch == 'amd64'
        run: |
          if grep -qU $'\r' build_scripts/install_linux.sh; then
            echo "::error::install_linux.sh has CRLF line endings - refusing to upload"
            exit 1
          fi

      # --clobber intentionally overwrites any existing same-named asset on the release.
      - name: Upload binary to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ steps.tag.outputs.tag }}" \
            build/geminiflatpanel-linux-${{ matrix.arch }} \
            --clobber

      # install_linux.sh is arch-independent - uploaded once by the amd64 leg only, so the two
      # matrix legs never race `gh release upload --clobber` against the same asset name.
      - name: Upload install_linux.sh to release
        if: matrix.arch == 'amd64'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ steps.tag.outputs.tag }}" \
            build_scripts/install_linux.sh \
            --clobber
